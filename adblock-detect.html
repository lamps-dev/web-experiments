<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="detect.js"></script>
    <style>
  #adblock-popup {
    --ab-red: #e53935;
    --ab-bg: #16161d;
    --ab-text: #f2f2f5;
    --ab-muted: #a0a0b0;

    width: min(92vw, 440px);
    padding: 2rem 1.75rem 1.5rem;
    border: 2px solid var(--ab-red);
    border-radius: 18px;
    background: var(--ab-bg);
    color: var(--ab-text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
    box-shadow: 0 20px 60px rgb(229 57 53 / 0.35);
    overscroll-behavior: contain; /* stops scroll inside the popup leaking to the page */
  }

  /* entry animation (fades + pops in) */
  #adblock-popup[open] {
    opacity: 1;
    transition: opacity 0.25s ease-out, transform 0.25s ease-out;
    @starting-style { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      transform: scale(1);
      @starting-style { transform: scale(0.85); }
    }
  }

  #adblock-popup::backdrop {
    background: rgb(0 0 0 / 0.75);
    backdrop-filter: blur(4px);
    overflow: hidden;              /* makes the backdrop a scroll container... */
    overscroll-behavior: contain;  /* ...so scrolling over it doesn't scroll the page */
    transition: background-color 0.25s ease-out;
  }
  #adblock-popup[open]::backdrop {
    @starting-style { background-color: rgb(0 0 0 / 0); }
  }

  #adblock-popup .ab-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 0.75rem;
    display: block;
  }
  @media (prefers-reduced-motion: no-preference) {
    #adblock-popup .ab-icon { animation: ab-wobble 0.6s 0.2s ease-in-out; }
  }
  @keyframes ab-wobble {
    0%, 100% { rotate: 0deg; }
    25% { rotate: -10deg; }
    75% { rotate: 10deg; }
  }

  #adblock-popup h2 {
    margin: 0 0 0.5rem;
    font-size: 1.6rem;
    color: var(--ab-red);
  }
  #adblock-popup p {
    margin: 0 0 1rem;
    line-height: 1.5;
    color: var(--ab-text);
  }
  #adblock-popup ol {
    margin: 0 auto 1.25rem;
    padding-left: 1.25rem;
    text-align: left;
    max-width: 320px;
    color: var(--ab-muted);
    font-size: 0.95rem;
    line-height: 1.6;
  }

  #adblock-popup .ab-actions {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  #adblock-popup button {
    font: inherit;
    font-weight: 600;
    padding: 0.75rem 1rem;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: filter 0.15s, background-color 0.15s;
  }
  #adblock-popup .ab-primary {
    background: var(--ab-red);
    color: #fff;
  }
  #adblock-popup .ab-primary:hover { filter: brightness(1.1); }
  #adblock-popup .ab-secondary {
    background: transparent;
    color: var(--ab-muted);
    font-weight: 400;
    font-size: 0.9rem;
  }
  #adblock-popup .ab-secondary:hover { color: var(--ab-text); }
  #adblock-popup button:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
  }
</style>
    <script>
        // only defined here, runs later when the fetch fails
        function adblock_detected() {
            document.getElementById("detected_msg").innerText = "adblock detected";
            showAdblockPopup();
        }
    </script>
    <title>Adblock Detect</title>
</head>
<body>
    <dialog id="adblock-popup" aria-labelledby="ab-title" aria-describedby="ab-desc" closedby="none">
        <svg class="ab-icon" viewBox="0 0 100 100" aria-hidden="true">
            <polygon points="30,3 70,3 97,30 97,70 70,97 30,97 3,70 3,30" fill="#e53935" stroke="#fff" stroke-width="4"/>
            <rect x="22" y="42" width="56" height="16" rx="3" fill="#fff"/>
        </svg>
        <h2 id="ab-title">Stop! You have an adblock!</h2>
        <p id="ab-desc">Ads help keep this site running. Please disable your adblocker for this site, then reload the page.</p>
        <ol>
            <li>Click your adblocker's icon in the toolbar</li>
            <li>Pause it / turn it off for this site</li>
            <li>Hit the button below</li>
            <li style="font-size: small;" id="useragent">Your user agent is: </li>
        </ol>
        <div class="ab-actions">
            <button type="button" class="ab-primary" id="ab-reload" autofocus>I've disabled it, reload</button>
            <!-- uncomment + set ALLOW_DISMISS = true if you want a way out -->
            <!-- <button type="button" class="ab-secondary" id="ab-continue">Continue anyway</button> -->
        </div>
    </dialog>

    <p id="detected_msg">no adblocker detected</p>

    <!-- popup script: has to be AFTER the dialog so it can find it -->
    <script>
        (() => {
            const popup = document.getElementById('adblock-popup');
            const ALLOW_DISMISS = false; // false = Esc and "continue" can't close it
            const useragent2 = window.navigator.userAgent;
            document.getElementById('useragent').innerText = `Your user agent is: ${useragent2}`



            window.showAdblockPopup = () => {
                if (!popup.open) popup.showModal();
            };

            document.getElementById('ab-reload').addEventListener('click', () => location.reload());

            const continueBtn = document.getElementById('ab-continue');
            if (ALLOW_DISMISS) {
                continueBtn?.addEventListener('click', () => popup.close());
            } else {
                continueBtn?.remove();
                // block Esc closing the popup
                popup.addEventListener('cancel', (e) => e.preventDefault());
            }
        })();
    </script>

    <!-- detector: no-cors so it only fails when something actually blocks it -->
    <script>
        fetch("https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js", { mode: "no-cors" })
            .catch(adblock_detected);
    </script>
</body>
</html>
